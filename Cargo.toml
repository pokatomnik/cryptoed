[package]
name = "cryptoed"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
cursive = { version = "0.21.1", features = ["toml"] }
futures-util = "0.3"
tokio = { version = "1.52.3", features = ["full"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
